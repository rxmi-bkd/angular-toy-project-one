<div class="grid gap-8 p-2">
  <form class="flex gap-2">
    <input type="text" placeholder="Filter by city" class="border p-2" [formField]="searchForm.city"/>
  </form>

  <section class="grid gap-2 grid-cols-2">
    @for (house of filteredHouses(); track $index) {
      <app-house-card [house]="house"/>
    }
  </section>
</div>
